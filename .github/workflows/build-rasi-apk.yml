name: Build RASI APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-rasi-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Save APK in repository
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/RASI.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/RASI.apk
          git diff --cached --quiet || git commit -m "Build RASI Android APK"
          git push
